name: Aktien-Screening

on:
  schedule:
    # Werktags 18:30 UTC — nach US-Handelsschluss ist die Datenlage vollständig.
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Universum (dax, germany, europe, sp500, all …)"
        default: "all"
      no_llm:
        description: "Ohne LLM-Einordnung laufen"
        type: boolean
        default: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Nötig, um das Journal zurückzuschreiben. In Actions ist das Dateisystem
    # nach dem Lauf weg — ohne Commit lernt das Tool nie etwas dazu.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -e .

      # Yahoo deckelt den Fundamentaldaten-Endpunkt bei rund 330 Abrufen, das
      # Universum hat 674. Der Bestand überbrückt das über mehrere Läufe — er
      # muss den Runner also überdauern. Ins Repository gehört er nicht: Er ist
      # Arbeitsvorrat, kein Messergebnis, und würde die Historie täglich um ein
      # Vielfaches seiner selbst aufblähen. Anders als das Journal ist er auch
      # jederzeit neu beschaffbar.
      - name: Bestand an Fundamentaldaten laden
        uses: actions/cache/restore@v4
        with:
          path: store/
          # Jeder Lauf schreibt einen neuen Schlüssel; `restore-keys` greift den
          # jüngsten vorhandenen. Ein Cache-Eintrag ist unveränderlich — ohne
          # rotierenden Schlüssel bliebe der Bestand für immer der vom ersten
          # Lauf.
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-

      - name: Screening starten
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Der Zeitplan übergibt keine Eingaben, deshalb entscheidet hier der
        # Ersatzwert über das Universum des täglichen Laufs. Er stand auf
        # 'europe' — der S&P 500 war damit vom automatischen Lauf ausgenommen.
        run: |
          broker screen \
            --universe "${{ inputs.universe || 'all' }}" \
            ${{ inputs.no_llm && '--no-llm' || '' }} \
            --report --json --notify

      # Bewusst `always()` und bewusst restore/save statt des kombinierten
      # `actions/cache`: Ein unvollständiger Lauf endet mit Exit-Code 1, und
      # genau dann ist der Bestand am wertvollsten — er enthält die Titel, die
      # heute noch durchkamen. Würde er nur bei grünem Lauf gespeichert, füllte
      # er sich nie an den Tagen, an denen er gebraucht wird.
      - name: Bestand sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: store/
          key: fundamentals-${{ github.run_id }}

      - name: Journal zurückschreiben
        if: always()
        run: |
          if [ -z "$(git status --porcelain journal/)" ]; then
            echo "Journal unverändert — nichts zu committen."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/
          git commit -m "Journal: Treffer vom $(date -u +%F)"
          # Der Lauf kann länger dauern als ein zwischenzeitlicher Push;
          # rebasen statt blind pushen.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report als Artifact ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-${{ github.run_number }}
          path: out/
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
