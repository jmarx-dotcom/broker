[project]
name = "broker"
version = "0.1.0"
description = "Screener für günstig bewertete Aktien: KGV-Analyse, Chart-Analyse und makroökonomischer Kontext"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
broker = "broker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
broker = ["universe/data/*.csv", "report/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
